- name: Configurar el servidor dns
  hosts: dns
  become: true
  tasks:
    - name: Instalar BIND
      ansible.builtin.apt:
        name: bind9
        state: present
        update_cache: true
    
    - name: Copiar opciones de BIND
      ansible.builtin.copy:
        src: files/named.conf.options
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: "0644"

    - name: Copiar definición de las zonas
      ansible.builtin.copy:
        src: files/named.conf.local
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: "0644"

    - name: Copiar los archivos de zonas
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/var/lib/bind/{{ item }}"
        owner: bind
        group: bind
        mode: "0644"
      loop: 
        - db.ignacio.test
        - db.192.168.57
      notify: Reiniciar BIND
    
    - name: Validar configuración de BIND
      ansible.builtin.command: named.checkconf
      changed_when: false

    - name: Validar zona directa
      ansible.builtin.command:
        argv:
          - named-checkzone
          - ignacio.test
          - var/lib/bind/db.ignacio.test
      changed_when: false
    
    - name: Validar zona inversa
      ansible.builtin.command:
        argv:
          - named-checkzone
          - 57.168.192.in-addr.ansible
          - /var/lib/bind/db.192.168.57
      changed_when: false

    - name: Asegurar que BIND está habilitado y activo
      ansible.builtin.service: 
        name: bind9
        enabled: true
        state: started
  
  handlers:
    - name: Reiniciar BIND
      ansible.builtin.service:
        name: bind9
        state: restarted
